<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Bay | The Port Authority Files</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./hud.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="view" aria-label="Harbor Bay 3D game"></canvas>
<div id="hud" hidden>
  <div class="left-dock">
    <section id="mission" class="panel">
      <div class="eyebrow gold"><span>◆ &nbsp;ACTIVE MISSION</span><strong id="mission-tag"></strong></div>
      <h1 id="mission-name"></h1>
      <div class="objective"><span id="mission-objective"></span><strong id="mission-distance"></strong></div>
      <div class="meter"><i id="mission-bar"></i></div>
    </section>
    <section id="dispatch" class="panel" hidden>
      <div class="eyebrow"><span><i class="alert-dot"></i> PORT PATROL</span><strong>DISPATCH</strong></div>
      <ul id="unit-list"></ul>
    </section>
  </div>
  <div class="right-dock">
    <section id="heat" class="panel">
      <div id="cash"></div>
      <div id="stars"></div>
      <div class="eyebrow"><span>POLICE HEAT</span><span>HARBOR BAY</span></div>
    </section>
    <section class="panel progress">
      <div class="eyebrow"><strong id="rank"></strong><span id="xp"></span></div>
      <div class="meter"><i id="xp-bar"></i></div>
    </section>
    <section id="crew" aria-label="Crew abilities"></section>
  </div>
  <div class="map-dock">
    <canvas id="map" width="212" height="212" aria-label="District minimap"></canvas>
    <section class="panel district"><strong id="district"></strong><span id="reputation"></span></section>
    <section class="panel vitals">
      <div><span>HP</span><div class="meter"><i id="health"></i></div></div>
      <div><span>AR</span><div class="meter"><i id="armor"></i></div></div>
    </section>
  </div>
  <section id="dialogue" class="panel" hidden>
    <img id="portrait" alt="" width="66" height="66">
    <div><strong>Nia</strong><p></p></div>
  </section>
  <section id="weapons" aria-label="Weapon slots"></section>
  <section id="vehicle" class="panel" hidden>
    <div class="eyebrow"><strong id="car-name"></strong><span id="damage"></span></div>
    <div class="speed"><strong id="speed"></strong><span>KM/H</span></div>
    <div class="speed-track"><i id="speed-fill"></i></div>
    <div class="radio"><kbd>R</kbd><span id="radio"></span></div>
  </section>
  <div id="interact" class="panel" hidden><kbd>E</kbd> <span id="hint"></span></div>
</div>
<main id="menu" hidden>
  <div class="menu-content">
    <p id="menu-label"></p>
    <h1 id="menu-heading"></h1>
    <div id="menu-actions"></div>
  </div>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
